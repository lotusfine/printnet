<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libreria Glaxara. Un mundo de cosas útiles</title>
    <meta name="description" content="Artículos de Libreria, oficina y todo para el colegio. Contamos con atencion personalizada y descuentos exclusivos." />
    
    <!-- Open Graph meta tags para mejorar la apariencia al compartir en redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://libreriaglaxara.com.ar/" />
    <meta property="og:title" content="Librería Glaxara | Un mundo de cosas útiles" />
    <meta property="og:description" content="Artículos de Libreria, oficina y todo para el colegio. Contamos con atencion personalizada y descuentos exclusivos." />
    <!-- Vive en public/, no en src/assets/: los de src/ los renombra la
         compilación agregándoles un código, y esta dirección tiene que ser
         estable para que WhatsApp y las redes la encuentren. -->
    <meta property="og:image" content="https://libreriaglaxara.com.ar/logo-glaxara.jpg" />
</head>
  <body>
    <div id="root"></div>
    <!-- Config de servidores: se edita en el servidor sin recompilar la app -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
